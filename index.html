    <!-- Prevent theme flash: resolve theme before Svelte mounts -->
    <script>
      (function() {
        var mode = localStorage.getItem('themeMode');
        // Migrate old key
        if (!mode) {
          var old = localStorage.getItem('theme');
          if (old === 'light' || old === 'dark') {
            mode = old;
            localStorage.setItem('themeMode', old);
            localStorage.removeItem('theme');
          }
        }
        var theme;
        if (mode === 'light') theme = 'light';
        else if (mode === 'dark') theme = 'dark';
        else {
          // auto: time-of-day based
          var h = new Date().getHours();
          theme = (h >= 6 && h < 18) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
